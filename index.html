<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>90 G4ME_WiP | -3xØc3t- L4B</title>
    <link rel="stylesheet" href="index.css">
</head>

<body>

<header id="header">

    <div class="header-brand">
        <div class="brand-main">-3xØc3t- L4B</div>
        <div class="brand-sub">DIGITAL L4B & EXPERIMENTATION</div>
    </div>

    <div class="header-game">
        <div class="game-number">90</div>
        <div class="game-name">G4ME_WiP</div>
    </div>

    <div class="header-actions">
        <button id="reset-game" class="header-button">RESET</button>
        <button id="open-menu" class="header-button">MENU</button>
    </div>

</header>


<main id="game">

    <div id="radial-interface">

        <svg
            id="radial-menus"
            xmlns="http://www.w3.org/2000/svg"
            preserveAspectRatio="none"
        >
            <path class="menu-sector" data-menu="top-left"></path>
            <path class="menu-sector" data-menu="top"></path>
            <path class="menu-sector" data-menu="top-right"></path>
            <path class="menu-sector" data-menu="right"></path>
            <path class="menu-sector" data-menu="bottom-right"></path>
            <path class="menu-sector" data-menu="bottom"></path>
            <path class="menu-sector" data-menu="bottom-left"></path>
            <path class="menu-sector" data-menu="left"></path>
        </svg>


        <section class="radial-panel panel-top-left">
            <div class="panel-label">PLAYER</div>
            <div class="panel-value" id="player-value">P1</div>
            <div class="panel-info" id="player-info">PLAYER 01</div>
        </section>


        <section class="radial-panel panel-top">

            <div class="panel-label">GAME</div>

            <div class="panel-value" id="turn-value">
                TURN 01
            </div>

            <div class="panel-info" id="round-value">
                ROUND 01
            </div>

        </section>


        <section class="radial-panel panel-top-right">

            <div class="panel-label">CELL</div>

            <div class="panel-value" id="cell-value">
                --
            </div>

            <div class="panel-info" id="cell-info">
                NO SELECTION
            </div>

        </section>


        <section class="radial-panel panel-left">

            <div class="panel-label">MAP</div>

            <div class="zoom-controls">

                <button
                    id="zoom-out"
                    class="zoom-button"
                    type="button"
                >
                    −
                </button>

                <div id="zoom-value">
                    100%
                </div>

                <button
                    id="zoom-in"
                    class="zoom-button"
                    type="button"
                >
                    +
                </button>

            </div>

            <div class="panel-info">
                MAP CONTROL
            </div>

        </section>


        <section class="radial-panel panel-right">

            <div class="panel-label">ACTION</div>

            <button
                id="confirm-action"
                class="panel-button"
                type="button"
                disabled
            >
                CONFIRM
            </button>

            <button
                id="cancel-action"
                class="panel-button"
                type="button"
                disabled
            >
                CANCEL
            </button>

        </section>


        <section class="radial-panel panel-bottom-left">

            <div class="panel-label">GRID</div>

            <div class="panel-value" id="grid-value">
                7 × 7
            </div>

            <div class="panel-info" id="grid-info">
                OCTAGON / SQUARE
            </div>

        </section>


        <section class="radial-panel panel-bottom">

            <div class="panel-label">SYSTEM</div>

            <div class="panel-value" id="system-status">
                READY
            </div>

            <div class="panel-info" id="system-message">
                SYSTEM READY
            </div>

        </section>


        <section class="radial-panel panel-bottom-right">

            <div class="panel-label">POSITION</div>

            <div class="panel-value" id="position-value">
                --
            </div>

            <div class="panel-info" id="position-info">
                NO POSITION
            </div>

        </section>

    </div>


    <div id="map-container">

        <div id="map">

            <div id="octagon-grid"></div>

            <div id="square-grid"></div>

            <div id="map-center">

                <div class="center-title">
                    90
                </div>

                <div class="center-subtitle">
                    G4ME_WiP
                </div>

            </div>

        </div>

    </div>


    <div id="selection-indicator"></div>

</main>


<footer id="footer">

    <div>
        -3xØc3t- L4B
    </div>

    <div>
        90 G4ME_WiP
    </div>

    <div id="footer-status">
        SYSTEM READY
    </div>

</footer>


<script src="index.js"></script>

</body>
</html>
