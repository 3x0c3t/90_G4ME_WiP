<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#02070c"
    >

    <title>
        90_G4ME_WiP | 3xØc3t L4B
    </title>

    <link
        rel="stylesheet"
        href="index.css"
    >

</head>


<body>

<div id="game">


    <!-- =====================================================
         HEADER
         ===================================================== -->

    <header id="header">

        <div class="header-brand">

            <div class="header-title">
                -3xØc3t- L4B
            </div>

            <div class="header-subtitle">
                DIGITAL L4B &amp; EXPERIMENTATION
            </div>

        </div>


        <div class="header-project">

            <span class="project-name">
                90_G4ME_WiP
            </span>

            <span class="project-version">
                v1.0
            </span>

        </div>


        <div class="header-player">

            <span>
                PLAYER
            </span>

            <strong id="player-value">
                P1
            </strong>

        </div>

    </header>



    <!-- =====================================================
         GAME AREA
         ===================================================== -->

    <main id="game-area">


        <!-- =================================================
             RADIAL INTERFACE
             ================================================= -->

        <svg
            id="radial-interface"
            xmlns="http://www.w3.org/2000/svg"
            aria-label="Interface radiale"
        >

            <defs>

                <filter
                    id="cyan-glow"
                    x="-50%"
                    y="-50%"
                    width="200%"
                    height="200%"
                >

                    <feGaussianBlur
                        stdDeviation="2"
                        result="blur"
                    />

                    <feMerge>

                        <feMergeNode
                            in="blur"
                        ></feMergeNode>

                        <feMergeNode
                            in="SourceGraphic"
                        ></feMergeNode>

                    </feMerge>

                </filter>

            </defs>


            <g id="menu-guides"></g>

            <g id="menu-title-paths"></g>

            <g id="menu-titles"></g>

        </svg>



        <!-- =================================================
             MENU CONTENT
             ================================================= -->

        <section
            id="menu-information"
            aria-label="Contenu des menus"
        >


            <!-- GAME -->

            <article
                class="radial-content radial-content-game"
                data-menu="game"
            >

                <div class="menu-content-item">
                    <span>TURN</span>
                    <strong id="content-turn">01</strong>
                </div>

                <div class="menu-content-item">
                    <span>ROUND</span>
                    <strong id="content-round">01</strong>
                </div>

                <div class="menu-content-item">
                    <span>MODE</span>
                    <strong>NORMAL</strong>
                </div>

            </article>



            <!-- CELL -->

            <article
                class="radial-content radial-content-cell"
                data-menu="cell"
            >

                <div class="menu-content-item">
                    <span>CELL</span>
                    <strong id="content-cell">NONE</strong>
                </div>

                <div class="menu-content-item">
                    <span>TYPE</span>
                    <strong id="content-type">EMPTY</strong>
                </div>

            </article>



            <!-- ACTION -->

            <article
                class="radial-content radial-content-action"
                data-menu="action"
            >

                <button
                    type="button"
                    class="menu-action-button"
                    id="btn-select"
                >
                    SELECT
                </button>

                <button
                    type="button"
                    class="menu-action-button"
                    id="btn-confirm"
                >
                    CONFIRM
                </button>

                <button
                    type="button"
                    class="menu-action-button"
                    id="btn-cancel"
                >
                    CANCEL
                </button>

            </article>



            <!-- POSITION -->

            <article
                class="radial-content radial-content-position"
                data-menu="position"
            >

                <div class="menu-content-item">
                    <span>X</span>
                    <strong id="content-x">--</strong>
                </div>

                <div class="menu-content-item">
                    <span>Y</span>
                    <strong id="content-y">--</strong>
                </div>

                <div class="menu-content-item">
                    <span>Z</span>
                    <strong>00</strong>
                </div>

            </article>



            <!-- SYSTEM -->

            <article
                class="radial-content radial-content-system"
                data-menu="system"
            >

                <div class="menu-content-item">
                    <span>STATUS</span>
                    <strong>ONLINE</strong>
                </div>

                <div class="menu-content-item">
                    <span>SYSTEM</span>
                    <strong>READY</strong>
                </div>

                <div
                    class="menu-system-message"
                    id="system-message"
                >
                    SYSTEM READY
                </div>

            </article>



            <!-- GRID -->

            <article
                class="radial-content radial-content-grid"
                data-menu="grid"
            >

                <div class="menu-content-item">
                    <span>GRID</span>
                    <strong>7 × 7</strong>
                </div>

                <div class="menu-content-item">
                    <span>CELLS</span>
                    <strong>49</strong>
                </div>

                <div class="menu-content-item">
                    <span>TYPE</span>
                    <strong>OCTAGON</strong>
                </div>

            </article>



            <!-- MAP -->

            <article
                class="radial-content radial-content-map"
                data-menu="map"
            >

                <div class="menu-content-item">
                    <span>ZOOM</span>
                    <strong id="content-zoom">
                        100%
                    </strong>
                </div>

                <div class="map-buttons">

                    <button
                        type="button"
                        class="menu-action-button"
                        id="btn-zoom-out"
                    >
                        −
                    </button>

                    <button
                        type="button"
                        class="menu-action-button"
                        id="btn-zoom-in"
                    >
                        +
                    </button>

                </div>

            </article>



            <!-- PLAYER -->

            <article
                class="radial-content radial-content-player"
                data-menu="player"
            >

                <div class="menu-content-item">
                    <span>PLAYER</span>
                    <strong id="content-player">P1</strong>
                </div>

                <div class="menu-content-item">
                    <span>PLAYERS</span>
                    <strong>02</strong>
                </div>

            </article>


        </section>



        <!-- =================================================
             MAP
             ================================================= -->

        <section
            id="map"
            aria-label="MAP"
        >

            <div id="map-inner">

                <div id="map-label">
                    MAP
                </div>

                <div id="map-grid">

                    <div id="octagon-grid"></div>

                    <div id="square-grid"></div>

                </div>

                <div id="map-center">
                    3xØc3t
                </div>

            </div>

        </section>


    </main>



    <!-- =====================================================
         FOOTER
         ===================================================== -->

    <footer id="footer">

        <span>
            90_G4ME_WiP
        </span>

        <span>
            DIGITAL EXPERIMENT
        </span>

        <span>
            v1.0
        </span>

    </footer>


</div>


<script src="index.js"></script>

</body>

</html>
