<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>90_G4ME_WiP</title>

    <link rel="stylesheet" href="index.css">
</head>

<body>

<header id="header">

    <div class="header-brand">
        <div class="header-title">-3xØc3t- L4B</div>
        <div class="header-subtitle">
            DIGITAL L4B & EXPERIMENTATION
        </div>
    </div>

    <div class="header-game">
        <span id="player-value">P1</span>
    </div>

    <div class="header-status">
        <span class="status-dot"></span>
        ONLINE
    </div>

</header>


<main id="game">

    <div id="radial-interface">

        <svg
            id="radial-menus"
            xmlns="http://www.w3.org/2000/svg"
        >

            <defs>

                <filter id="glow">
                    <feGaussianBlur
                        stdDeviation="2"
                        result="blur"
                    />

                    <feMerge>
                        <feMergeNode in="blur"/>
                        <feMergeNode in="SourceGraphic"/>
                    </feMerge>
                </filter>

            </defs>


            <g id="menu-sectors"></g>

            <g
                id="menu-guides"
                pointer-events="none"
            ></g>

            <g
                id="menu-title-paths"
                pointer-events="none"
            ></g>

            <g
                id="menu-titles"
                pointer-events="none"
            ></g>

            <g
                id="menu-information"
                pointer-events="none"
            ></g>

        </svg>


        <div id="map-container">

            <div id="map">

                <div id="octagon-grid"></div>

                <div id="square-grid"></div>

                <div id="map-center">
                    <div class="map-center-title">
                        MAP
                    </div>

                    <div class="map-center-subtitle">
                        90_G4ME
                    </div>
                </div>

            </div>

        </div>

    </div>

</main>


<footer id="footer">

    <div>
        90_G4ME_WiP
    </div>

    <div>
        DIGITAL GAME EXPERIMENT
    </div>

    <div class="footer-online">
        <span class="status-dot"></span>
        ONLINE
    </div>

</footer>


<script src="index.js"></script>

</body>
</html>
