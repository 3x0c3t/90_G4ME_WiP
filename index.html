<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        90_G4ME_WiP | -3xØc3t- L4B
    </title>

    <meta
        name="description"
        content="-3xØc3t- L4B | 90_G4ME_WiP"
    >

    <link
        rel="stylesheet"
        href="index.css"
    >

    <link
        rel="stylesheet"
        href="map.css"
    >

</head>


<body>


<header id="main-header">

    <div class="header-left">

        <div class="brand">

            <span class="brand-main">
                -3xØc3t- L4B
            </span>

            <span class="brand-sub">
                DIGITAL L4B &amp; EXPERIMENTATION
            </span>

        </div>

    </div>


    <div class="header-center">

        <div class="game-title">

            <span class="game-number">
                90
            </span>

            <span class="game-name">
                G4ME_WiP
            </span>

        </div>

        <div class="game-status">

            <span class="status-dot"></span>

            <span>
                WORK IN PROGRESS
            </span>

        </div>

    </div>


    <div class="header-right">

        <button
            class="header-button"
            id="btn-reset"
            type="button"
        >
            RESET
        </button>

        <button
            class="header-button"
            id="btn-menu"
            type="button"
        >
            MENU
        </button>

    </div>

</header>


<main id="game">


    <div id="radial-interface">


        <!-- =================================================
             CONTENU DES MENUS
             ================================================= -->

        <div id="menu-content">


            <!-- GAME -->

            <section
                class="menu-content-panel menu-game"
                id="panel-top"
            >

                <div class="content-inner">

                    <div class="game-info">

                        <div>

                            <span>
                                TURN
                            </span>

                            <strong id="turn-value">
                                01
                            </strong>

                        </div>


                        <div>

                            <span>
                                ROUND
                            </span>

                            <strong id="round-value">
                                01
                            </strong>

                        </div>


                        <div>

                            <span>
                                PLAYERS
                            </span>

                            <strong id="players-value">
                                02
                            </strong>

                        </div>

                    </div>

                </div>

            </section>


            <!-- CELL -->

            <section
                class="menu-content-panel menu-cell"
                id="panel-top-right"
            >

                <div class="content-inner">

                    <div class="cell-info">

                        <div>

                            <span>
                                SELECTED
                            </span>

                            <strong id="selected-cell">
                                NONE
                            </strong>

                        </div>


                        <div>

                            <span>
                                TYPE
                            </span>

                            <strong id="selected-type">
                                EMPTY
                            </strong>

                        </div>

                    </div>

                </div>

            </section>


            <!-- ACTION -->

            <section
                class="menu-content-panel menu-action"
                id="panel-right"
            >

                <div class="content-inner">

                    <div class="actions">

                        <button
                            class="action-button"
                            id="btn-select"
                            type="button"
                        >
                            SELECT
                        </button>

                        <button
                            class="action-button"
                            id="btn-confirm"
                            type="button"
                        >
                            CONFIRM
                        </button>

                        <button
                            class="action-button"
                            id="btn-cancel"
                            type="button"
                        >
                            CANCEL
                        </button>

                    </div>

                </div>

            </section>


            <!-- POSITION -->

            <section
                class="menu-content-panel menu-position"
                id="panel-bottom-right"
            >

                <div class="content-inner">

                    <div class="position-info">

                        <span>
                            X:
                            <strong id="position-x">
                                --
                            </strong>
                        </span>

                        <span>
                            Y:
                            <strong id="position-y">
                                --
                            </strong>
                        </span>

                    </div>

                </div>

            </section>


            <!-- SYSTEM -->

            <section
                class="menu-content-panel menu-system"
                id="panel-bottom"
            >

                <div class="content-inner">

                    <div
                        class="system-message"
                        id="system-message"
                    >
                        SYSTEM READY
                    </div>

                </div>

            </section>


            <!-- GRID -->

            <section
                class="menu-content-panel menu-grid"
                id="panel-bottom-left"
            >

                <div class="content-inner">

                    <div class="grid-info">

                        <div>

                            <span>
                                OCTAGONS
                            </span>

                            <strong id="octagon-count">
                                49
                            </strong>

                        </div>


                        <div>

                            <span>
                                SQUARES
                            </span>

                            <strong id="square-count">
                                64
                            </strong>

                        </div>

                    </div>

                </div>

            </section>


            <!-- MAP -->

            <section
                class="menu-content-panel menu-map"
                id="panel-left"
            >

                <div class="content-inner">

                    <div class="map-controls">

                        <button
                            class="control-button"
                            id="btn-zoom-in"
                            type="button"
                        >
                            +
                        </button>

                        <span class="zoom-value">

                            <span id="zoom-value">
                                100
                            </span>

                            %

                        </span>

                        <button
                            class="control-button"
                            id="btn-zoom-out"
                            type="button"
                        >
                            −
                        </button>

                    </div>

                </div>

            </section>


            <!-- PLAYER -->

            <section
                class="menu-content-panel menu-player"
                id="panel-top-left"
            >

                <div class="content-inner">

                    <div class="player-indicator">

                        <span class="player-color"></span>

                        <div>

                            <strong id="player-name">
                                PLAYER 01
                            </strong>

                            <small id="player-state">
                                READY
                            </small>

                        </div>

                    </div>

                </div>

            </section>


        </div>


        <!-- =================================================
             STRUCTURE RADIALE
             ================================================= -->

        <svg
            id="radial-interface-svg"
            viewBox="0 0 1000 1000"
            preserveAspectRatio="none"
            aria-hidden="true"
        >

            <defs>

                <filter
                    id="title-glow"
                    x="-50%"
                    y="-50%"
                    width="200%"
                    height="200%"
                >

                    <feGaussianBlur
                        stdDeviation="2"
                        result="blur"
                    />

                    <feMerge>

                        <feMergeNode
                            in="blur"
                        ></feMergeNode>

                        <feMergeNode
                            in="SourceGraphic"
                        ></feMergeNode>

                    </feMerge>

                </filter>

            </defs>


            <g id="menu-sector-lines"></g>

            <g id="map-circle-layer"></g>

            <g id="title-circle-layer"></g>

            <g id="menu-title-layer"></g>

        </svg>


        <!-- =================================================
             MAP CENTRALE
             ================================================= -->

        <section
            id="map-container"
            aria-label="Carte de jeu"
        >

            <div id="map">

                <div
                    id="octagon-grid"
                    aria-label="Grille octogonale"
                ></div>

                <div
                    id="square-grid"
                    aria-label="Grille carrée"
                ></div>

                <div id="map-center">

                    <span class="center-number">
                        90
                    </span>

                    <span class="center-label">
                        G4ME
                    </span>

                </div>

            </div>

        </section>


    </div>

</main>


<footer id="main-footer">

    <div class="footer-left">
        -3xØc3t- L4B
    </div>

    <div class="footer-center">

        <span>
            90_G4ME_WiP
        </span>

        <span class="footer-separator">
            •
        </span>

        <span>
            EXPERIMENTAL GAME INTERFACE
        </span>

    </div>

    <div class="footer-right">

        <span id="footer-status">
            ONLINE
        </span>

    </div>

</footer>


<script src="map.js"></script>
<script src="index.js"></script>


</body>

</html>
